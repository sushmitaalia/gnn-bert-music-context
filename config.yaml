project:
  name: gnn-bert-music-context
  course: CSE425

audio:
  sample_rate: 22050
  segment_seconds: 5
  feature_type: chroma
  chroma_bins: 12
  similarity_threshold: 0.997

text:
  model_name: distilbert-base-uncased
  max_length: 128

task1:
  dataset: MusicCaps
  task: caption_to_tag_proxy
  batch_size: 16
  epochs: 5
  learning_rate: 0.00002

task2:
  dataset: FMA-small
  model: GraphSAGE
  batch_size: 32

task3:
  dataset: MagnaTagATune
  batch_size: 16
  epochs: 3
  labels:
    - rock
    - pop
    - classical
    - techno
    - electronic
    - ambient
    - slow
    - fast
    - loud
    - quiet

task4:
  dataset: MusicCaps
  embedding_dim: 128
  temperature: 0.07
  epochs: 5
